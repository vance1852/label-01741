# 生产环境配置
spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.elderly: warn
    org.springframework: warn

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://your-domain.com}
