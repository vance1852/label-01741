version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: elderly-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: elderly_care
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: elderly-backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: elderly_care
      DB_USER: root
      DB_PASSWORD: 123456
      TZ: Asia/Shanghai
      JAVA_OPTS: -Duser.timezone=Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend-admin:
    build: ./frontend-admin
    container_name: elderly-frontend-admin
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  mysql_data:
